[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# UP042 (StrEnum) is ignored because local dev still runs Python 3.10, which lacks enum.StrEnum.
ignore = ["B008", "E501", "UP017", "UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
