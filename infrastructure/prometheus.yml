global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/agent-alerts.yml

scrape_configs:
  - job_name: mapgo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: mapgo-event-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: mapgo-agent-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "agent-planner:9100"
          - "agent-critic:9100"
          - "agent-replanner:9100"
