name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check (backend, CommonJS)
        run: |
          for f in server.js src/*.js src/routes/*.js public/sw.js test/*.js test/*.cjs; do
            node --check "$f"
          done

      - name: Syntax check (frontend, ES Modules)
        run: |
          mkdir -p /tmp/mjs
          find public/js -name "*.js" | while read -r f; do
            cp "$f" /tmp/mjs/x.mjs
            node --check /tmp/mjs/x.mjs || { echo "FAIL $f"; exit 1; }
          done

      - name: Backend API tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Playwright
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Frontend E2E smoke tests
        run: npm run test:e2e
