name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff==0.16.0 mypy bandit pip-audit
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy backend/app
      - run: bandit -q -r backend/app
      - run: pip-audit -r backend/requirements.txt

  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mapgo_test
          POSTGRES_USER: mapgo
          POSTGRES_PASSWORD: mapgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapgo -d mapgo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mapgo:mapgo_test@localhost:5432/mapgo_test
      MOCK_MAP_PROVIDER: "true"
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379/15
      LOCATION_ENCRYPTION_KEY: test-only-location-key-for-field-encryption
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migration upgrade, rollback and upgrade
        run: |
          alembic upgrade head
          alembic downgrade 0001
          alembic upgrade head
          alembic check
      - name: Real Redis/PostgreSQL Worker fault recovery
        run: |
          mkdir -p artifacts
          python -m pytest -c backend/pytest.ini backend/tests/integration/test_worker_fault_recovery_real.py -vv --junitxml=artifacts/worker-fault-recovery.xml
      - name: Tests and coverage
        run: python -m pytest -c backend/pytest.ini --cov --cov-report=term-missing --cov-report=xml
      - name: Chaos / fault injection smoke
        run: python backend/tests/chaos/run_chaos.py
      - name: AI offline evaluation
        run: |
          python backend/tests/evaluation/evaluate_intent.py
          python backend/tests/evaluation/evaluate_agents.py
          python backend/tests/evaluation/evaluate_routes.py
          python backend/tests/evaluation/evaluate_multi_agent.py
          python backend/tests/evaluation/evaluate_model_router.py
          python backend/tests/evaluation/replay_agent_benchmark.py
          python backend/tests/evaluation/agent_evaluation_framework.py --mode offline --suite full
      - uses: actions/upload-artifact@v4
        with:
          name: python-evidence
          path: |
            coverage.xml
            artifacts/worker-fault-recovery.xml
            artifacts/agent-evaluation/*.json
            artifacts/agent-evaluation/*.md

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mapgo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
